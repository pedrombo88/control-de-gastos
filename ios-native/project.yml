name: Budviva
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Budviva:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.budviva
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Budviva
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Budviva necesita la cámara para escanear tus tickets de compra."
        NSPhotoLibraryUsageDescription: "Budviva permite seleccionar fotografías de tickets."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
  BudvivaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Budviva
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.budviva.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Budviva:
    build:
      targets:
        Budviva: all
    run:
      config: Debug
    test:
      targets:
        - BudvivaTests
