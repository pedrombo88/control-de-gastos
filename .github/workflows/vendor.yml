name: Preparar OCR y PDF locales
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor.yml'
      - 'tools/build-vendor.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar versiones fijadas
        run: |
          mkdir -p .vendor-tmp
          npm install --prefix .vendor-tmp --ignore-scripts --no-audit --no-fund --package-lock=false --no-save \
            tesseract.js@5.1.1 tesseract.js-core@5.0.0 pdfjs-dist@6.5.438 @tesseract.js-data/spa@1.0.0
      - name: Copiar y comprobar recursos
        run: node tools/build-vendor.cjs
      - name: Incorporar recursos al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if git diff --cached --quiet; then
            echo "Ya están actualizados"
            exit 0
          fi
          git commit -m "build: empaquetar OCR y PDF locales con integridad SHA-256"
          git pull --rebase origin main
          git push origin HEAD:main
