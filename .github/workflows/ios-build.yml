name: Compilar Budviva iOS
on:
  push:
    branches: [main]
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
concurrency:
  group: budviva-ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Instalar generador de proyectos
        run: brew install xcodegen
      - name: Generar icono de la aplicación
        run: python3 ios-native/tools/generate-icon.py
      - name: Generar proyecto Xcode
        run: |
          cd ios-native
          xcodegen generate --spec project.yml
      - name: Compilar para simulador iOS (sin firma)
        run: |
          xcodebuild -project ios-native/Budviva.xcodeproj \
            -scheme Budviva \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Compilar pruebas XCTest para simulador
        run: |
          xcodebuild -project ios-native/Budviva.xcodeproj \
            -scheme Budviva \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
      - name: Ejecutar pruebas XCTest en simulador
        timeout-minutes: 18
        run: |
          set -euo pipefail
          echo "Dispositivos de simulador disponibles:"
          xcrun simctl list devices available
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          devices=json.load(sys.stdin)["devices"]
          ios=[device for runtime,group in devices.items() if "iOS" in runtime for device in group]
          choices=[item for item in ios if "iPhone" in item["name"] and item["state"]=="Shutdown" and item.get("isAvailable",True)]
          if not choices: choices=[item for item in ios if "iPhone" in item["name"] and item.get("isAvailable",True)]
          print(choices[0]["udid"] if choices else "")
          ')
          if [ -z "$DEVICE_ID" ]; then echo "No se encuentra un simulador iPhone disponible"; exit 1; fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project ios-native/Budviva.xcodeproj \
            -scheme Budviva \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -resultBundlePath ios-native/BudvivaTestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Guardar informe de XCTest si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: budviva-ios-xctest
          path: ios-native/BudvivaTestResults.xcresult
          retention-days: 7
      - name: Capturar inicio de Budviva en el simulador
        if: success()
        timeout-minutes: 4
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/Budviva.app' -type d | head -n 1)
          if [ -z "$APP" ]; then echo "Budviva.app no encontrada"; exit 1; fi
          DEVICE_ID=$(xcrun simctl list devices booted -j | python3 -c '
          import json,sys
          values=json.load(sys.stdin)["devices"]
          choices=[d for group in values.values() for d in group if "iPhone" in d["name"] and d["state"]=="Booted"]
          print(choices[0]["udid"] if choices else "")
          ')
          if [ -z "$DEVICE_ID" ]; then echo "Simulador iPhone no iniciado"; exit 1; fi
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl terminate "$DEVICE_ID" com.example.budviva || true
          xcrun simctl launch "$DEVICE_ID" com.example.budviva
          sleep 4
          mkdir -p ios-native/capturas-simulador
          xcrun simctl io "$DEVICE_ID" screenshot ios-native/capturas-simulador/inicio-iphone.png
      - name: Guardar captura de inicio de iPhone
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: budviva-iphone-preview
          path: ios-native/capturas-simulador/inicio-iphone.png
          retention-days: 14
