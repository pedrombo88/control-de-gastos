name: Pruebas de interfaz móvil
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'compartidos.html'
      - 'compartidos.js'
      - 'shared-config.js'
      - 'backend/functions/**'
      - 'recurring.js'
      - 'stats.js'
      - 'smart-import.js'
      - 'documents.js'
      - 'backup-crypto.js'
      - 'tests/**'
      - 'playwright.config.cjs'
      - '.github/workflows/ui-e2e.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: budviva-ui-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.57.0 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Probar navegación y funcionalidades móviles
        run: npx playwright test --config=playwright.config.cjs
      - name: Guardar capturas de auditoría visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budviva-ui-capturas
          path: ui-capturas/
          if-no-files-found: warn
          retention-days: 14
      - name: Guardar capturas e informe en errores
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: budviva-mobile-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
