name: Budviva security checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate UI and run regression tests
        run: npm run check
      - name: Safe live smoke test (no credentials, no account deletion)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          BUDVIVA_LIVE_SMOKE: '1'
        run: node --test tests/account-deletion.test.cjs
